services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orthoready
      POSTGRES_PASSWORD: orthoready
      POSTGRES_DB: orthoready
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthoready"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: development
      DEMO_MODE: "true"
      SECRET_KEY: local-dev-only-secret
      DATABASE_URL: postgresql+psycopg://orthoready:orthoready@db:5432/orthoready
    # Local-dev convenience: apply migrations, then start the server.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"

volumes:
  pgdata:
