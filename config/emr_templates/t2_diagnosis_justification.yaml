  - {"key": "resp", "section": "Объективная оценка", "label": "ДС", "emr_type": "text", "source": "copy:t1_primary_exam.resp"}
  - {"key": "msk", "section": "Объективная оценка", "label": "ОДС", "emr_type": "text", "source": "copy:t1_primary_exam.msk"}
  - {"key": "gu", "section": "Объективная оценка", "label": "МПС", "emr_type": "text", "source": "copy:t1_primary_exam.gu"}
  - {"key": "gi", "section": "Объективная оценка", "label": "ЖКТ", "emr_type": "text", "source": "copy:t1_primary_exam.gi"}
  - {"key": "neuro", "section": "Объективная оценка", "label": "Неврологическая система", "emr_type": "line", "source": "copy:t1_primary_exam.neuro"}
  - {"key": "local_status", "section": "Локальный статус", "label": "Описание органа или системы", "emr_type": "text", "source": "copy:t1_primary_exam.local_status"}
  - {"key": "studies", "section": "Исследования", "label": "Инструментальные и лабораторные обследования", "emr_type": "service", "source": "board"}
