  - {"key": "spo2", "section": "Физикальные показатели", "label": "Сатурация, SpO2 %", "emr_type": "number", "path": "latest_vitals.spo2"}
  - {"key": "temp", "section": "Физикальные показатели", "label": "Температура тела, °C", "emr_type": "number", "path": "latest_vitals.temp"}
