  - {"key": "weight", "section": "Физикальные показатели", "label": "Вес, кг", "emr_type": "number", "path": "preop.vitals.weight", "required": true}
  - {"key": "height", "section": "Физикальные показатели", "label": "Рост, см", "emr_type": "number", "path": "preop.vitals.height", "required": true}
  - {"key": "bmi", "section": "Физикальные показатели", "label": "ИМТ", "emr_type": "calculate", "source": "skip"}
  - {"key": "general_condition", "section": "Общее состояние", "label": "Описание", "emr_type": "text", "source": "copy:t1_primary_exam.general_condition", "override_path": "preop.general_condition"}
  - {"key": "psych_assessment", "section": "Психологическая оценка", "label": "Психологическая оценка", "emr_type": "checkcombo"}
  - {"key": "skin", "section": "Объективная оценка", "label": "Кожа", "emr_type": "text", "path": "systems.skin", "format": "system", "emr_prefill": true}
