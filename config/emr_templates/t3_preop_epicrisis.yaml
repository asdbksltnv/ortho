# T3 Предоперационный эпикриз (58 fields, 2 critical). Generated only when the board items
# in gating_items are done, so it never cites pending results.
# Field order mirrors the AccuracyMed screen exactly. Header fields (patient, doctor, date,
# document number) are filled by AccuracyMed and are not part of this file.
# source: form | generated | copy:<template>.<key> | board | schedule | staff | skip
#         plus case / procedure (values from the case or the procedure template).
# required: true = the app (not the EMR) needs the value before generation.

id: "t3_preop_epicrisis"
title_ru: "Предоперационный эпикриз"
version: 1
status: "ready"
requires_clinical_validation: true
gating_items: ["labs_core", "consults", "anaesthesia"]
fields:
  - {"key": "complaints", "section": "Жалобы", "label": "Основные жалобы", "emr_type": "text", "source": "copy:t1_primary_exam.complaints"}
  - {"key": "history_brief", "section": "Анамнез морби", "label": "Краткая информация", "emr_type": "text", "source": "copy:t1_primary_exam.history_brief"}
  - {"key": "course", "section": "Анамнез морби", "label": "Течение болезни", "emr_type": "line", "source": "copy:t1_primary_exam.course"}
  - {"key": "allergy_has", "section": "Аллергия", "label": "Есть аллергия?", "emr_type": "line", "source": "copy:t1_primary_exam.allergy_has"}
  - {"key": "allergy_description", "section": "Аллергия", "label": "Описание аллергии", "emr_type": "text", "source": "copy:t1_primary_exam.allergy_description"}
  - {"key": "past_history", "section": "Перенесённые операции и заболевания", "label": "Перенесённые операции и заболевания", "emr_type": "text", "source": "copy:t1_primary_exam.past_history"}
  - {"key": "epidemiology", "section": "Перенесённые операции и заболевания", "label": "Эпидемиологический анамнез, трансфузии", "emr_type": "text", "source": "copy:t1_primary_exam.epidemiology", "emr_prefill": true, "keep_if_empty": true}
  - {"key": "medications", "section": "Лекарственный анамнез", "label": "Медикаменты, которые принимает", "emr_type": "text", "source": "copy:t1_primary_exam.medications"}
  - {"key": "alcohol", "section": "Социальные факторы", "label": "Употребление алкоголя", "emr_type": "text", "source": "copy:t1_primary_exam.alcohol"}
  - {"key": "tobacco", "section": "Социальные факторы", "label": "Употребление табака", "emr_type": "line", "source": "copy:t1_primary_exam.tobacco"}
  - {"key": "drugs", "section": "Социальные факторы", "label": "Потребитель наркотиков", "emr_type": "text", "source": "copy:t1_primary_exam.drugs"}
  - {"key": "physical_activity", "section": "Социальные факторы", "label": "Физическая активность", "emr_type": "line", "source": "copy:t2_diagnosis_justification.physical_activity"}
  - {"key": "socioeconomic", "section": "Социальные факторы", "label": "Социально-экономическая оценка", "emr_type": "line", "source": "copy:t1_primary_exam.socioeconomic", "critical": true}
  - {"key": "economic_ability", "section": "Потребности пациента", "label": "Оценка экономической возможности", "emr_type": "line", "critical": true, "path": "preop.economic_assessment", "hint": "TODO(clinical): формулировки"}
  - {"key": "social_needs", "section": "Потребности пациента", "label": "Социальные потребности", "emr_type": "text", "path": "preop.social_needs"}
