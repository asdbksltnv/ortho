# Floor layout of the ward, taken from the 10th-floor evacuation plan («10-QAVAT EVAKUATSIYA REJASI»,
# AKFA MEDLINE, approved 1 December 2025). Coordinates are in plan units (x right, y down) on a
# 1000 x 520 canvas and only approximate the drawing. Patient rooms get `beds`; service rooms have
# none. Loaded idempotently at deploy (python -m app.floorplan); edit and redeploy to change it.
# TODO: confirm the number of beds in each patient room (1 assumed).
version: 1
ward: "Отделение ортопедии и травматологии, 10 этаж"
floor: 10
canvas: {width: 1000, height: 520}
