# Render Blueprint. Syntax checked against https://render.com/docs/blueprint-spec
# Pilot runs with synthetic data only (DEMO_MODE=true); see DEPLOY.md.
databases:
  - name: orthoready-db
    databaseName: orthoready
    user: orthoready
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: orthoready
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: python -m app.predeploy
    # No dockerCommand: the Dockerfile CMD starts uvicorn on $PORT (Render does not shell-parse this field).
    envVars:
      - key: ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: orthoready-db
          property: connectionString
      - key: TZ_DISPLAY
        value: Asia/Tashkent
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MODE
        value: webhook
      - key: AI_PROVIDER
        value: template
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: ""
      - key: STORAGE_BACKEND
        value: disabled
      - key: SESSION_TIMEOUT_MIN
        value: "15"
      - key: DECIMAL_SEPARATOR
        value: ","
