# Render Blueprint. Syntax checked against https://render.com/docs/blueprint-spec
# Pilot runs with synthetic data only (DEMO_MODE=true); see DEPLOY.md.
databases:
  - name: orthoready-db
    databaseName: orthoready
    user: orthoready
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: orthoready
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: alembic upgrade head
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: orthoready-db
          property: connectionString
      - key: TZ_DISPLAY
        value: Asia/Tashkent
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MODE
        value: webhook
      - key: AI_PROVIDER
        value: template
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: ""
      - key: STORAGE_BACKEND
        value: disabled
      - key: SESSION_TIMEOUT_MIN
        value: "15"
      - key: DECIMAL_SEPARATOR
        value: ","

  # Render cron schedules are in UTC. Asia/Tashkent is UTC+5 (no DST): 18:00 local = 13:00 UTC.
  - type: cron
    name: orthoready-daily-digest
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 13 * * *"
    dockerCommand: python -m app.jobs.daily_digest
    envVars:
      - key: ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: orthoready-db
          property: connectionString
      - key: TZ_DISPLAY
        value: Asia/Tashkent
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  - type: cron
    name: orthoready-lab-expiry
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 2 * * *"
    dockerCommand: python -m app.jobs.lab_expiry
    envVars:
      - key: ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: orthoready-db
          property: connectionString
      - key: TZ_DISPLAY
        value: Asia/Tashkent
      - key: TELEGRAM_BOT_TOKEN
        sync: false
