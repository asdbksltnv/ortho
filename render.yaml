# Render Blueprint. Syntax checked against https://render.com/docs/blueprint-spec
# Production configuration (DEMO_MODE=false). See DEPLOY.md before entering real patient data.
databases:
  - name: orthoready-db
    databaseName: orthoready
    user: orthoready
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: orthoready
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: python -m app.predeploy
    # No dockerCommand: the Dockerfile CMD starts uvicorn on $PORT (Render does not shell-parse this field).
    envVars:
      - key: ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: orthoready-db
          property: connectionString
      - key: TZ_DISPLAY
        value: Asia/Tashkent
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MODE
        value: webhook
      - key: PUBLIC_URL
        sync: false # https://<your-service>.onrender.com, used to register the Telegram webhook
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # first administrator; used only when no admin exists yet
      - key: ADMIN_FULL_NAME
        value: Администратор
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false # model name from your OpenAI account, e.g. the one you use for chat
      - key: STORAGE_BACKEND
        value: disabled
      - key: SESSION_TIMEOUT_MIN
        value: "15"
      - key: DECIMAL_SEPARATOR
        value: ","
