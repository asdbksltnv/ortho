repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy app
        language: system
        pass_filenames: false
        types: [python]
      - id: frontend-lint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-prettier
        name: prettier
        entry: npm --prefix frontend exec prettier -- --write
        language: system
        files: ^frontend/src/
